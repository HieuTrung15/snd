name: Deploy vinatex to ERPNext server

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy via SSH with password
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no frappe@14.225.164.136 << 'EOF'
            cd /home/frappe/frappe-bench
            chmod +x deploy_vinatex.sh
            ./deploy_vinatex.sh
          EOF
