name: Deploy vinatex to ERPNext server

on:
  push:
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run deploy via SSH
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > id_ci_key
          chmod 600 id_ci_key
          ssh -i id_ci_key -o StrictHostKeyChecking=no frappe@14.225.164.136 << 'EOF'
            cd /home/frappe/frappe-bench
            ./deploy_vinatex.sh
          EOF
