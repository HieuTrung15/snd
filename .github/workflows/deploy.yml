name: Deploy vinatex to ERPNext server

on:
  push:
    branches: [ "develop" ]   # << dùng develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 14.225.164.136
          username: frappe
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/frappe/frappe-bench
            ./deploy_vinatex.sh
