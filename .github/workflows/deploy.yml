name: Deploy vinatex to ERPNext server

on:
  push:
    branches: [ "develop" ]   # << dùng develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # port: 22  # nếu m dùng port khác thì mở dòng này ra và sửa
          script: |
            cd /home/frappe/frappe-bench
            ./deploy_vinatex.sh
